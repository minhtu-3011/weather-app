<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <div class="search">
            <input type="text" placeholder="nhập tên thành phố" spellcheck="false">
            <button><img src="images/search.png" alt=""></button>
            <button class="predict-btn">Dự đoán ngày mai</button>
            <p class="prediction"></p>
        </div>
        <div class="error">
            <p>Tên thành phố không hợp lệ</p>
        </div>
        <div class="weather">
            <img src="images/rain.png" class="weather-icon" alt="">
            <h1 class="temp">22°C</h1>
            <h2 class="city">New York</h2>
            <div class="details">
                <div class="col">
                    <img src="images/humidity.png" alt="">
                    <div>
                        <div class="humidity">50%</div>
                        <p>độ ẩm</p>
                    </div>
                    
                </div>
                <div class="col">
                    <img src="images/wind.png" alt="">
                    <div>
                        <div class="wind">15 km/h</div>
                        <p>tốc độ gió</p>
                    </div>
                    
                </div>
            </div>
        </div>
    </div>


    <script>
        const apiKey = "5fd3288f019fe38d9101c153275b2925";
        const apiUrl = "https://api.openweathermap.org/data/2.5/weather?units=metric&q=";

        const searchBox = document.querySelector(".search input");
        const searchBtn = document.querySelector(".search button");
        const weatherIcon = document.querySelector(".weather-icon");

        async function checkWeather(city){
            const response = await fetch(apiUrl + city + `&appid=${apiKey}`);

            if(response.status == 404) {
                document.querySelector(".error").style.display = "block";
                document.querySelector(".weather").style.display = "none";
            
            } else {
                var data = await response.json();
                console.log(data)

                document.querySelector(".city").innerHTML = data.name;
                document.querySelector(".temp").innerHTML = Math.round(data.main.temp) + "°C";
                document.querySelector(".humidity").innerHTML = data.main.humidity + "%";
                document.querySelector(".wind").innerHTML = data.wind.speed + " km/h";

                if (data.weather[0].main == 'Clouds') {
                    weatherIcon.src = "images/clouds.png"
                } else if (data.weather[0].main == 'Clear') {
                    weatherIcon.src = "images/clear.png"
                } else if (data.weather[0].main == 'Rain') {
                    weatherIcon.src = "images/rain.png"
                } else if (data.weather[0].main == 'Drizzle') {
                    weatherIcon.src = "images/drizzle.png"
                } else if (data.weather[0].main == 'Mist') {
                    weatherIcon.src = "images/mist.png"
                }

                document.querySelector(".weather").style.display = "block";
                document.querySelector(".error").style.display = "none";

                

            }
            
        }
        searchBtn.addEventListener("click",() => {
            checkWeather(searchBox.value);
        })



        
    const predictBtn = document.querySelector(".predict-btn");
        const predictionEl = document.querySelector(".prediction");

        const cityMap = {
            "can tho": 0,
            "ha noi": 1,
            "da nang": 2
        };

        predictBtn.addEventListener("click", async () => {
            const city = document.querySelector(".search input").value.toLowerCase();
            const cityCode = cityMap[city];

            if (cityCode === undefined) {
                alert("City chưa hỗ trợ");
                return;
            }

            const today = new Date();
            const targetDay = today.getDate();
            const targetMonth = today.getMonth() + 1;

            const days = await getLast5Days(city);

            if (days.length < 5) {
                alert("Không đủ dữ liệu");
                return;
            }

            const input = prepareInput(cityCode, days, targetDay, targetMonth);

            console.log("INPUT LENGTH:", input.length); // phải = 35

            const response = await predictWeather(input);

            if (!response || response.error) {
                alert("Lỗi dự đoán");
                console.log(response);
                return;
            }

            const result = response.result;

            const temperature = result[0];
            const humidity = result[1];
            const wind = result[2];
            const weather = result[3];
            const nextDay = new Date();
            nextDay.setDate(nextDay.getDate() + 1);
            const predictedWeather = decodeWeather(weather);

            document.querySelector(".city").innerHTML = `${city} (Dự đoán)`;
            document.querySelector(".temp").innerHTML = `${temperature.toFixed(1)}°C`;
            document.querySelector(".humidity").innerHTML = `${humidity.toFixed(1)}%`;
            document.querySelector(".wind").innerHTML = `${wind.toFixed(1)} km/h`;

            if (predictedWeather === "Clouds") {
                weatherIcon.src = "images/clouds.png";
            } else if (predictedWeather === "Clear") {
                weatherIcon.src = "images/clear.png";
            } else if (predictedWeather === "Rain") {
                weatherIcon.src = "images/rain.png";
            } else if (predictedWeather === "Drizzle") {
                weatherIcon.src = "images/drizzle.png";
            } else if (predictedWeather === "Mist") {
                weatherIcon.src = "images/mist.png";
            }

            document.querySelector(".weather").style.display = "block";
            document.querySelector(".error").style.display = "none";


        });
    async function getLast5Days(city) {
            const response = await fetch(
                "https://api.openweathermap.org/data/2.5/forecast?units=metric&q="
                + city + `&appid=${apiKey}`
            );

            const data = await response.json();

            let result = [];

            for (let i = 0; i < data.list.length; i += 8) {
                const item = data.list[i];

                result.push({
                    temp: item.main.temp,
                    humidity: item.main.humidity,
                    wind: item.wind.speed,
                    weather: item.weather[0].main
                });

                if (result.length == 5) break;
            }

            return result;
        }
        function prepareInput(cityCode, days, targetDay, targetMonth) {
                let input = [];

                days.forEach((d, index) => {
                    input.push(cityCode);

                    input.push(targetMonth);
                    input.push(targetDay - (5 - index));

                    input.push(d.temp);
                    input.push(d.humidity);
                    input.push(d.wind);

                    input.push(encodeWeather(d.weather));
                });

                return input;
            }
            
            function encodeWeather(w) {
                    if (w.includes("Rain")) return 1;
                    if (w.includes("Cloud")) return 0;
                    return 2; // Sunny
                }

                function decodeWeather(code) {
                    const map = {
                        0: "Cloudy",
                        1: "Rain",
                        2: "Sunny"
                    };
                    return map[Math.round(code)] || "Unknown";
                }
                async function predictWeather(input) {
                        const res = await fetch("http://127.0.0.1:5000/predict", {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify({ input })
                        });

                        const data = await res.json();

                        console.log("DATA:", data);

                        return data;
                    }
    </script>
</body>
</html>
